; Pengaturan PHP tambahan untuk LokerLens (disalin ke conf.d oleh Dockerfile).

; Berkas bukti maks. 10 MB per berkas, bisa beberapa berkas sekaligus (BuatSuratController)
upload_max_filesize = 10M
post_max_size = 40M
max_file_uploads = 10

; Jangan tampilkan versi PHP di header jawaban
expose_php = Off

; Opcache: kode tidak berubah selama container berjalan
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
